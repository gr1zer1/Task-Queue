
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - b_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  b_network:
    driver: bridge

volumes:
  db_data:
    driver: local